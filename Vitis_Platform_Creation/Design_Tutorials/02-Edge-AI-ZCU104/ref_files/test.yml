name: PFM_D_02-ZCU104
category: canary
platform: [zcu104]
flow: vitis
env:
  build: env_setup_zynqmp_notoolchain.sh
  board: env_setup_zynqmp_notoolchain.sh
targets:
  vitis_hw_emu:
    timeout: 200m
    run: make all TARGET=hw_emu CXX=${XILINX_VITIS}/gnu/aarch64/lin/aarch64-linux/bin/aarch64-linux-gnu-g++ HOST_ARCH=aarch64
      EDGE_COMMON_SW=${EDGE_COMMON_SW} SDKTARGETSYSROOT=${SYSROOT} ROOTFS=${EDGE_COMMON_SW}/rootfs.ext4 IMAGE=${EDGE_COMMON_SW}/Image
      EMU_CMD="./launch_hw_emu.sh -run-app run_app.sh" EMBEDDED_PACKAGE_OUT=./step3_validate/package.hw/ EMBEDDED_EXEC_SCRIPT=./run_app.sh
  vitis_hw_build:
    timeout: 480m
    run: make sd_card TARGET=hw CXX=${XILINX_VITIS}/gnu/aarch64/lin/aarch64-linux/bin/aarch64-linux-gnu-g++ HOST_ARCH=aarch64
      EDGE_COMMON_SW=${EDGE_COMMON_SW} SDKTARGETSYSROOT=${SYSROOT} ROOTFS=${EDGE_COMMON_SW}/rootfs.ext4 IMAGE=${EDGE_COMMON_SW}/Image
      EMU_CMD="./launch_hw_emu.sh -run-app run_app.sh" EMBEDDED_PACKAGE_OUT=./step3_validate/package.hw/ EMBEDDED_EXEC_SCRIPT=./run_app.sh
  vitis_hw_run:
    timeout: 60m
    run: make run_test TARGET=hw CXX=${XILINX_VITIS}/gnu/aarch64/lin/aarch64-linux/bin/aarch64-linux-gnu-g++ HOST_ARCH=aarch64
      EDGE_COMMON_SW=${EDGE_COMMON_SW} SDKTARGETSYSROOT=${SYSROOT} ROOTFS=${EDGE_COMMON_SW}/rootfs.ext4 IMAGE=${EDGE_COMMON_SW}/Image
      EMU_CMD="./launch_hw_emu.sh -run-app run_app.sh" EMBEDDED_PACKAGE_OUT=./step3_validate/package.hw/ EMBEDDED_EXEC_SCRIPT=./run_app.sh
