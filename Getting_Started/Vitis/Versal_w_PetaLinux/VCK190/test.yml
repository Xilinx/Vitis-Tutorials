name: GS_vitis_vck190
category: canary
platform: [vck190]
flow: versal
env:
  build: env_setup_versal.sh
  board: env_setup_versal.sh
targets:
  vitis_hw_emu:
    timeout: 120m
    memory: 64GB
    run: make all TARGET=hw_emu EMU_CMD="./launch_hw_emu.sh -run-app post_boot.sh " EMBEDDED_PACKAGE_OUT=./vitis_dir/pack_out_dir
      EMBEDDED_EXEC_SCRIPT=./post_boot.sh
  vitis_hw_build:
    timeout: 300m
    memory: 64GB
    run: make all TARGET=hw EMU_CMD="./launch_hw_emu.sh -run-app post_boot.sh " EMBEDDED_PACKAGE_OUT=./vitis_dir/pack_out_dir
      EMBEDDED_EXEC_SCRIPT=./post_boot.sh
  vitis_hw_run:
    timeout: 30m
    memory: 64GB
    run: make run_test TARGET=hw EMU_CMD="./launch_hw_emu.sh -run-app post_boot.sh " EMBEDDED_PACKAGE_OUT=./vitis_dir/pack_out_dir
      EMBEDDED_EXEC_SCRIPT=./post_boot.sh
