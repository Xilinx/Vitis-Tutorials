name: AIE_D_21-Back-Projection-SAR
category: canary
platform: [vck190]
flow: versal
env:
  build: env_setup_versal.sh
  board: env_setup_versal.sh
targets:
  vitis_hw_build:
    timeout: 300m
    memory: 64GB
    run: make dev8 TARGET=hw EMU_CMD="./launch_hw_emu.sh -run-app embedded_exec.sh " EMBEDDED_PACKAGE_OUT=./package8 EMBEDDED_EXEC_SCRIPT=./embedded_exec.sh
  vitis_hw_run:
    timeout: 30m
    memory: 64GB
    run: make run_test TARGET=hw EMU_CMD="./launch_hw_emu.sh -run-app embedded_exec.sh " EMBEDDED_PACKAGE_OUT=./package8 EMBEDDED_EXEC_SCRIPT=./embedded_exec.sh
