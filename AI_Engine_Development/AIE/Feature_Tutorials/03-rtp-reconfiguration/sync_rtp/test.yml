name: AIE_F_03_RTP_sync_rtp
category: canary
platform: [xilinx_vck190_base]
flow: versal
env:
  build: env_setup_versal.sh
  board: env_setup_versal.sh
targets:
  vitis_hw_build:
    timeout: 470m
    run: make sd_card TARGET=hw HOST_ARCH=aarch64 EDGE_COMMON_SW=${EDGE_COMMON_SW} SYSROOT=${SYSROOT} SDKTARGETSYSROOT=${SYSROOT}
      ROOTFS=${EDGE_COMMON_SW}/rootfs.ext4 IMAGE=${EDGE_COMMON_SW}/Image EMU_CMD="./launch_hw_emu.sh -run-app embedded_exec.sh"
      EMBEDDED_PACKAGE_OUT=./ EMBEDDED_EXEC_SCRIPT=./embedded_exec.sh
  vitis_hw_run:
    timeout: 30m
    run: make run_test TARGET=hw HOST_ARCH=aarch64 EDGE_COMMON_SW=${EDGE_COMMON_SW} SYSROOT=${SYSROOT} SDKTARGETSYSROOT=${SYSROOT}
      ROOTFS=${EDGE_COMMON_SW}/rootfs.ext4 IMAGE=${EDGE_COMMON_SW}/Image EMU_CMD="./launch_hw_emu.sh -run-app embedded_exec.sh"
      EMBEDDED_PACKAGE_OUT=./ EMBEDDED_EXEC_SCRIPT=./embedded_exec.sh
