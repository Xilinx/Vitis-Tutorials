#
# Function: Applies a cyclic shift to the 8-stream sample block
#           prior to the DFT stage.
# Streams:  sig_i[8] x 128-bit in  -->  sig_o[8] x 128-bit out
# Clock:    5.0 ns (200 MHz)
# Build:    v++ -c --mode hls --config hls_cyclic_shift.cfg
#

part=xcvc1902-vsva2197-2MP-e-S

[hls]
flow_target=vitis
clock=5.0ns
clock_uncertainty=27%

# C-Synthesis:
syn.top=m16_ssr8_cyclic_shift_wrapper
syn.file=../channelizer_src/hls/m16_ssr8_cyclic_shift/m16_ssr8_cyclic_shift.cpp
syn.file_cflags=../channelizer_src/hls/m16_ssr8_cyclic_shift/m16_ssr8_cyclic_shift.cpp,-I../channelizer_src/hls/m16_ssr8_cyclic_shift
syn.output.format=xo
