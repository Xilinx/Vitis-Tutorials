# ============================================================
# Vitis Subsystem Link Configuration: Channelizer VSS
#
# Channelizer signal chain (M=16, SSR=8, P/Q=8/7):
#
#  External input (7 x AXI4-S streams @ 200 MHz)
#       |
#  [m16_ssr8_permute_fb_i_wrapper]  HLS  -- sig_i[7] --> sig_o[8]
#       |  (sig_o_0..sig_o_7)
#  [AIE Filterbank]   PLIOs: filterbank_in_1..8 (in), filterbank_out_1..8 (out)
#       |  (filterbank_out_1..8)
#  [m16_ssr8_permute_fb_o_wrapper]  HLS  -- sig_i[8] --> sig_o[8]
#       |  (sig_o_0..sig_o_7)
#  [m16_ssr8_cyclic_shift_wrapper]  HLS  -- sig_i[8] --> sig_o[8]
#       |  (sig_o_0..sig_o_7)
#  [AIE DFT]          PLIOs: dft_in_1..8 (in), dft_out_1..8 (out)
#       |
#  External output: dft_out_1..8
#
# HLS port naming:  hls::stream arrays disaggregate as <param>_<index>
#                   e.g. sig_i[7] -> sig_i_0 .. sig_i_6
#                        sig_o[8] -> sig_o_0 .. sig_o_7
# PLIO naming: filterbank_in/out_<n> and dft_in/out_<n>  (n = 1..8)
# Clock: 200 MHz (5.0 ns) on all HLS kernels
# ============================================================

part=xcvc1902-vsva2197-2MP-e-S

freqhz=200000000:m16_ssr8_cyclic_shift_wrapper
freqhz=200000000:m16_ssr8_permute_fb_i_wrapper
freqhz=200000000:m16_ssr8_permute_fb_o_wrapper

[connectivity]
nk=m16_ssr8_cyclic_shift_wrapper:1:m16_ssr8_cyclic_shift_wrapper
nk=m16_ssr8_permute_fb_i_wrapper:1:m16_ssr8_permute_fb_i_wrapper
nk=m16_ssr8_permute_fb_o_wrapper:1:m16_ssr8_permute_fb_o_wrapper

# ---- permute_fb_o outputs --> cyclic_shift inputs ----
stream_connect=m16_ssr8_permute_fb_o_wrapper.sig_o_0:m16_ssr8_cyclic_shift_wrapper.sig_i_0
stream_connect=m16_ssr8_permute_fb_o_wrapper.sig_o_1:m16_ssr8_cyclic_shift_wrapper.sig_i_1
stream_connect=m16_ssr8_permute_fb_o_wrapper.sig_o_2:m16_ssr8_cyclic_shift_wrapper.sig_i_2
stream_connect=m16_ssr8_permute_fb_o_wrapper.sig_o_3:m16_ssr8_cyclic_shift_wrapper.sig_i_3
stream_connect=m16_ssr8_permute_fb_o_wrapper.sig_o_4:m16_ssr8_cyclic_shift_wrapper.sig_i_4
stream_connect=m16_ssr8_permute_fb_o_wrapper.sig_o_5:m16_ssr8_cyclic_shift_wrapper.sig_i_5
stream_connect=m16_ssr8_permute_fb_o_wrapper.sig_o_6:m16_ssr8_cyclic_shift_wrapper.sig_i_6
stream_connect=m16_ssr8_permute_fb_o_wrapper.sig_o_7:m16_ssr8_cyclic_shift_wrapper.sig_i_7

# ---- cyclic_shift outputs --> AIE DFT inputs ----
stream_connect=m16_ssr8_cyclic_shift_wrapper.sig_o_0:ai_engine_0.dft_in_1
stream_connect=m16_ssr8_cyclic_shift_wrapper.sig_o_1:ai_engine_0.dft_in_2
stream_connect=m16_ssr8_cyclic_shift_wrapper.sig_o_2:ai_engine_0.dft_in_3
stream_connect=m16_ssr8_cyclic_shift_wrapper.sig_o_3:ai_engine_0.dft_in_4
stream_connect=m16_ssr8_cyclic_shift_wrapper.sig_o_4:ai_engine_0.dft_in_5
stream_connect=m16_ssr8_cyclic_shift_wrapper.sig_o_5:ai_engine_0.dft_in_6
stream_connect=m16_ssr8_cyclic_shift_wrapper.sig_o_6:ai_engine_0.dft_in_7
stream_connect=m16_ssr8_cyclic_shift_wrapper.sig_o_7:ai_engine_0.dft_in_8

# ---- permute_fb_i outputs --> AIE filterbank inputs ----
stream_connect=m16_ssr8_permute_fb_i_wrapper.sig_o_0:ai_engine_0.filterbank_in_1
stream_connect=m16_ssr8_permute_fb_i_wrapper.sig_o_1:ai_engine_0.filterbank_in_2
stream_connect=m16_ssr8_permute_fb_i_wrapper.sig_o_2:ai_engine_0.filterbank_in_3
stream_connect=m16_ssr8_permute_fb_i_wrapper.sig_o_3:ai_engine_0.filterbank_in_4
stream_connect=m16_ssr8_permute_fb_i_wrapper.sig_o_4:ai_engine_0.filterbank_in_5
stream_connect=m16_ssr8_permute_fb_i_wrapper.sig_o_5:ai_engine_0.filterbank_in_6
stream_connect=m16_ssr8_permute_fb_i_wrapper.sig_o_6:ai_engine_0.filterbank_in_7
stream_connect=m16_ssr8_permute_fb_i_wrapper.sig_o_7:ai_engine_0.filterbank_in_8

# ---- AIE filterbank outputs --> permute_fb_o inputs ----
stream_connect=ai_engine_0.filterbank_out_1:m16_ssr8_permute_fb_o_wrapper.sig_i_0
stream_connect=ai_engine_0.filterbank_out_2:m16_ssr8_permute_fb_o_wrapper.sig_i_1
stream_connect=ai_engine_0.filterbank_out_3:m16_ssr8_permute_fb_o_wrapper.sig_i_2
stream_connect=ai_engine_0.filterbank_out_4:m16_ssr8_permute_fb_o_wrapper.sig_i_3
stream_connect=ai_engine_0.filterbank_out_5:m16_ssr8_permute_fb_o_wrapper.sig_i_4
stream_connect=ai_engine_0.filterbank_out_6:m16_ssr8_permute_fb_o_wrapper.sig_i_5
stream_connect=ai_engine_0.filterbank_out_7:m16_ssr8_permute_fb_o_wrapper.sig_i_6
stream_connect=ai_engine_0.filterbank_out_8:m16_ssr8_permute_fb_o_wrapper.sig_i_7

vss=amd.com:vmclib:DUT:1.0:m16_ssr8_cyclic_shift_wrapper,m16_ssr8_permute_fb_i_wrapper,m16_ssr8_permute_fb_o_wrapper,ai_engine_0
